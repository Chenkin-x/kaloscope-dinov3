model:
  name_or_path: null  # Explicit random initialization.
  pooling: cls
  projection_dim: 128
  backbone_config:
    model_type: dinov3_vit
    image_size: 224
    patch_size: 16
    hidden_size: 384
    intermediate_size: 1536
    num_hidden_layers: 12
    num_attention_heads: 6
    num_register_tokens: 4
data:
  train: base
  image_size: 224
  workers: 4
train_scope: backbone
classification_weight: 0.0
contrastive_weight: 1.0
contrastive_mode: instance
memory_bank_size: 4096
output: runs/custom_vit
