# Native temporal CLI configuration. Edit paths; launch with 8 processes.
paths: /path/to/paths.npy
metadata: /path/to/artist_year_data_v1
panel: /path/to/artist_full_eval_v1
output: runs/kaloscope3/v1-sigmoid-2k
model:
  name: dinov3_vitb16
  weights: /path/to/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
  pooling: cls_mean
  projection_dim: 256
image_size: 512
batch_size: 256
workers: 16
eval_workers: 8
eval_batch_size: 128
precision: bf16
seed: 20261004
window_days: 365
train_from_block: 8
backbone_lr: 2.0e-05
projector_lr: 0.0002
temperature_bias_lr: 0.001
weight_decay: 0.05
gradient_clip: 1.0
warmup_steps: 1000
eval_every: 1000
save_every: 500
log_every: 20
max_coverage_passes: 50
min_effective_rank: 16.0
min_feature_std: 0.0001
early_stop:
  min_delta: 0.001
  reduce_patience: 3
  stop_patience: 6
  min_factor: 0.0625
  min_coverage: 2.0
  regression_tolerance: 0.05
  failure_patience: 3
