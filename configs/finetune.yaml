model:
  name: dinov3_vits16
  weights: null
  pooling: cls
  projection_dim: 128
data:
  train: base
  val: null
  image_size: 224
  workers: 4
  # mean: [0.485, 0.456, 0.406]    # 归一化均值，默认 ImageNet (LVD-1689M)
  # std: [0.229, 0.224, 0.225]     # 归一化标准差，默认 ImageNet (LVD-1689M)
  # custom_transform: dinov3.finetune.data.sat_transform  # 完全自定义 transform，替换默认管线
  # augment:                        # 数据增强配置，默认不开启
  #   random_resized_crop: true
  #   random_resized_crop_scale: [0.5, 1.0]
  #   random_horizontal_flip: true
  #   color_jitter: {brightness: 0.3, contrast: 0.3, saturation: 0.3, hue: 0.1, p: 0.8}
  #   random_grayscale: true
  #   random_grayscale_p: 0.2
epochs: 20
batch_size: 16
lr: 0.0001
weight_decay: 0.05
optimization:
  scheduler: cosine
  warmup_epochs: 2
  warmup_start_lr: 0.000001
  min_lr: 0.000001
  weight_decay_end: 0.05
  layer_decay: 0.75
  exclude_bias_norm_decay: true
  backbone_lr_multiplier: 1.0
  head_lr_multiplier: 1.0
  projector_lr_multiplier: 1.0
  patch_embed_lr_multiplier: 1.0
  freeze_last_layer_epochs: 0
  label_smoothing: 0.1
  ema_decay: null
train_scope: all
classification_weight: 1.0
contrastive_weight: 0.2
two_views: false  # true enables two-view CE even when contrastive_weight is zero
contrastive_mode: supervised
temperature: 0.1
memory_bank_size: 4096
precision: fp32
output: runs/dinov3
resume: null
deepspeed: null
wandb: null
