name: Temporal training checks

on:
  push:
    branches: [main, clean, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ''
      ACCELERATE_USE_CPU: 'true'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy Pillow omegaconf scipy ruff 'transformers~=5.8.1' 'accelerate~=1.13.0'
      - name: Check maintained training modules
        run: |
          ruff check --config pyproject.toml dinov3 tests train_temporal.py
      - name: Run CPU and two-rank Gloo regression tests
        run: python -m unittest discover -s tests -v
