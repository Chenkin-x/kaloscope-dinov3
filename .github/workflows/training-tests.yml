name: Training regression tests

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy Pillow omegaconf scipy ruff setuptools wheel
          python -m pip install --no-deps -e .
      - name: Check maintained training modules
        run: |
          ruff check --config pyproject.toml dinov3/finetune/temporal tests
          ruff format --config pyproject.toml --check dinov3/finetune/temporal tests
      - name: Run CPU and two-rank Gloo regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify installed wheel imports without research sources
        run: |
          python -m pip wheel --no-deps --no-build-isolation . -w /tmp/kaloscope-wheel
          python -m pip install --no-deps --force-reinstall /tmp/kaloscope-wheel/*.whl
          cd /tmp
          python -c 'from dinov3.finetune.temporal.train import train; from dinov3.finetune.temporal.model import Encoder'
